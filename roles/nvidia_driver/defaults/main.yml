---
nvidia_driver_ubuntu_version: ""
nvidia_driver_source: nvidia
nvidia_driver_package: "{{ 'nvidia-open' if nvidia_driver_source == 'nvidia' else 'nvidia-driver-' ~ nvidia_driver_branch ~ '-open' }}"
nvidia_driver_module_package: ""
nvidia_driver_branch: ""
nvidia_driver_keyring_url: ""
_nvidia_driver_packages: "{{ [nvidia_driver_package] + ([nvidia_driver_module_package] if nvidia_driver_source == 'ubuntu' and nvidia_driver_module_package | length > 0 else []) }}"
nvidia_driver_prereq_packages:
  - ca-certificates
  - curl
  - linux-headers-generic
  - build-essential
  - dkms
  - ubuntu-drivers-common
