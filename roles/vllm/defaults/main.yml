---
vllm_version: ""
vllm_python: python3
vllm_venv: /opt/vllm-env
vllm_service_name: vllm
vllm_service_user: vllm
vllm_state_dir: /var/lib/vllm
vllm_config_dir: /etc/vllm
vllm_model_id: ""
vllm_model_revision: ""
vllm_model_name: "{{ vllm_model_id.split('/')[-1] }}"
vllm_model_dir: "/opt/models/{{ vllm_model_id | replace('/', '--') }}"
vllm_hf_cache: /opt/models/hf-cache
vllm_hf_token_file: ""
vllm_download_user: "{{ ansible_user | default(ansible_facts.user_id) }}"
vllm_host: 127.0.0.1
vllm_port: 8000
vllm_api_key: ""
vllm_options: {}
vllm_environment:
  CUDA_HOME: /usr/local/cuda
vllm_ready_timeout: 1800
vllm_prereq_packages:
  - ca-certificates
  - python3-venv
  - python3-dev
  - python3-packaging
  - build-essential
  - ninja-build
_vllm_model_identity: "{{ vllm_model_id }}\n{{ vllm_model_revision }}\n"
