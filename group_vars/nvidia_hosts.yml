---
nvidia_driver_ubuntu_version: "2404"
nvidia_driver_source: nvidia
nvidia_driver_branch: "615"
nvidia_driver_keyring_url: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu{{ nvidia_driver_ubuntu_version }}/x86_64/cuda-keyring_1.1-1_all.deb"

cuda_toolkit_home: /usr/local/cuda-13.4
cuda_toolkit_display_version: "13.4"
cuda_toolkit_keyring_url: "{{ nvidia_driver_keyring_url }}"
cuda_toolkit_packages:
  - cuda-toolkit-13-4

nvidia_container_toolkit_configure_docker: true
nvidia_container_toolkit_docker_set_as_default: false

# vllm.yml: one 96 GB Blackwell GPU
vllm_version: 0.33.0
vllm_model_id: nvidia/Qwen3.8-27B-NVFP4
vllm_model_revision: 482ca0f3832238542f8f5295dde86b5f22711d80
vllm_environment:
  CUDA_HOME: /usr/local/cuda
vllm_options:
  max-model-len: 262144 # Input and output together; native context
  gpu-memory-utilization: 0.9 # Fraction of GPU memory
  kv-cache-dtype: fp8
  max-num-seqs: 64 # Admission limit; parallel capacity depends on context
  max-num-batched-tokens: 8192
  long-prefill-token-threshold: 1024 # Base chunk cap with competing requests
  long-prefill-token-threshold-adaptive: true # Share the token budget across requests
  mm-processor-cache-gb: 0
  reasoning-parser: qwen3
  enable-auto-tool-choice: true
  tool-call-parser: qwen3_coder
  disable-prefix-caching: true
  disable-flashinfer-autotune: true
  speculative-config:
    method: mtp
    num_speculative_tokens: 2 # MTP draft tokens
  override-generation-config:
    temperature: 1.0 # Official thinking profile
    top_p: 0.95
    top_k: 20
    min_p: 0
    repetition_penalty: 1.0
    presence_penalty: 0
    frequency_penalty: 0
    max_new_tokens: 131072 # 128K generated tokens, within the total context
  default-chat-template-kwargs:
    enable_thinking: true
    reasoning_effort: xhigh

# strata.yml: prepare one profile; service activation is opt-in
strata_family: nvfp4
strata_model: NVFP4 # Ready-made GPTQ pack with NVFP4 expert weights
strata_config_tag: nvfp4-nvfp4
strata_context: 262144 # Per conversation, input and output together; no YaRN
strata_parallel: 4 # Request four 256K slots
strata_memory_reserve_gib: 10 # Keep available for the OS
strata_vision: gpu
strata_setup_options:
  - --kv
  - int8
  - --kv-streaming
  - 'off' # Keep context on the GPU
  - --low-ram
  - resident # Low-RAM expert placement; NVFP4 setup computes a bounded RAM cache
  - --mtp
  - 'on'
  - --vram-reserve-mib
  - '1024'
strata_conversation_cache_mib: 5120 # Shared across the four slots
strata_user_args: # Operator overrides in the upstream model JSON
  - --ram-keep-gib
  - '{{ strata_memory_reserve_gib }}'
  - --conversation-cache-min-free-mib
  - '{{ (strata_memory_reserve_gib | int) * 1024 }}'
  - --ple-io
  - direct
  - --no-ple-prefetch
  - --no-prefill-borrow
  - --prefill
  - '2048'
strata_environment:
  STRATA_BATCH_MTP: '1' # Enable MTP in concurrent decode where supported
  STRATA_BATCH_DECODE_SHARE: '0' # Skip decode between chunks of another request's prefill
  STRATA_SLOT_COPY_DIRECT: '1' # Transfer GPU history between sessions without a RAM KV copy
  STRATA_EMBED_VRAM: '1' # Keep BF16 token embeddings on the GPU
  MALLOC_MMAP_THRESHOLD_: '1048576' # glibc mmap threshold used by the reference profile
strata_start_service: false # Prepare only; do not enable or start the service
